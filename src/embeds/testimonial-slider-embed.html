<div class="heard-ts" data-heard-ts>

<style>
  .heard-ts {
    --ts-ink: #1d1d1d;
    --ts-radius: 1.875rem;
    --ts-gap: 2.25rem;
    --ts-media-w: 23.3125rem;
    --ts-quote-size: 1.5rem;
    --ts-anim: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    max-width: 46.875rem;
    margin: 0 auto;
    color: var(--ts-ink);
    font-family: "P22 Mackinac Pro", "P22Mackinac", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .heard-ts *,
  .heard-ts *::before,
  .heard-ts *::after { box-sizing: border-box; }

  .heard-ts__viewport {
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .heard-ts__viewport:active { cursor: grabbing; }

  .heard-ts__track {
    display: flex;
    transition: transform var(--ts-anim);
    will-change: transform;
  }

  .heard-ts__slide {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    gap: var(--ts-gap);
  }

  .heard-ts__media {
    flex: 0 0 var(--ts-media-w);
    max-width: var(--ts-media-w);
  }
  .heard-ts__media img {
    display: block;
    width: 100%;
    aspect-ratio: 373 / 399;
    object-fit: cover;
    border-radius: var(--ts-radius);
    -webkit-user-drag: none;
    user-select: none;
  }

  .heard-ts__body {
    flex: 1 1 auto;
    min-width: 0;
    padding-top: 4rem;
  }
  .heard-ts__quote {
    margin: 0;
    font-size: var(--ts-quote-size);
    line-height: 1.24;
    font-weight: 500;
    text-wrap: balance;
  }
  .heard-ts__attr {
    margin: 2.3em 0 0;
    font-size: var(--ts-quote-size);
    line-height: 1.24;
    font-weight: 500;
  }

  .heard-ts__controls {
    display: flex;
    gap: 1.125rem;
    margin-top: 1.625rem;
  }
  .heard-ts[data-single] .heard-ts__controls { display: none; }

  .heard-ts__btn {
    width: 3.0625rem;
    height: 3.0625rem;
    padding: 0;
    border: 0.0625rem solid var(--ts-ink);
    border-radius: 31.25rem;
    background: transparent;
    color: var(--ts-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .heard-ts__btn:hover { background: var(--ts-ink); color: #fff; }
  .heard-ts__btn:focus-visible { outline: 0.125rem solid var(--ts-ink); outline-offset: 0.1875rem; }
  .heard-ts__btn svg { width: 1.375rem; height: auto; display: block; }
  .heard-ts__btn--prev svg { transform: scaleX(-1); }

  @media (max-width: 40rem) {
    .heard-ts__slide {
      flex-direction: column;
      gap: 1.5rem;
    }
    .heard-ts__media {
      flex-basis: auto;
      max-width: 100%;
      width: 100%;
    }
    .heard-ts__body { padding-top: 0; }
    .heard-ts { --ts-quote-size: 1.25rem; }
    .heard-ts__attr { margin-top: 1.8em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .heard-ts__track { transition: none; }
  }
</style>

<script>
(function () {
  var ARROW = '<svg viewBox="0 0 22.7118 19.7117" fill="none" aria-hidden="true" focusable="false">' +
    '<path d="M0 10.3082H11H22M12.8333 19.3559L22 10.3082L11.9167 0.355857" stroke="currentColor" stroke-width="1" stroke-linecap="square"/></svg>';

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function makeButton(dir, label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'heard-ts__btn heard-ts__btn--' + dir;
    b.setAttribute('aria-label', label);
    b.innerHTML = ARROW;
    return b;
  }

  function initSlider(root) {
    if (root.__heardTsInit) return;
    root.__heardTsInit = true;

    var dataEl = root.querySelector('.heard-ts__data');
    var slides = [];
    try { slides = JSON.parse(dataEl ? dataEl.textContent : '[]'); }
    catch (e) { console.error('Heard slider: invalid testimonial JSON.', e); return; }
    if (!Array.isArray(slides) || !slides.length) return;

    var count = slides.length;
    var viewport = document.createElement('div');
    viewport.className = 'heard-ts__viewport';

    var track = document.createElement('div');
    track.className = 'heard-ts__track';

    slides.forEach(function (s, i) {
      var slide = document.createElement('div');
      slide.className = 'heard-ts__slide';
      slide.setAttribute('role', 'group');
      slide.setAttribute('aria-roledescription', 'slide');
      slide.setAttribute('aria-label', (i + 1) + ' of ' + count);

      var media = s.image
        ? '<div class="heard-ts__media"><img src="' + esc(s.image) + '" alt="' +
          esc(s.alt || s.name || '') + '" loading="lazy" draggable="false"' +
          (s.imagePosition ? ' style="object-position:' + String(s.imagePosition).replace(/[<>"']/g, '') + '"' : '') +
          '></div>'
        : '';

      var lines = [];
      if (s.name) lines.push(esc(s.name));
      if (s.title) lines.push(esc(s.title));
      var attr = lines.length
        ? '<p class="heard-ts__attr">' + lines.join('<br>') + '</p>'
        : '';

      slide.innerHTML = media +
        '<div class="heard-ts__body">' +
          '<p class="heard-ts__quote">\u201C' + esc(s.quote || '') + '\u201D</p>' +
          attr +
        '</div>';
      track.appendChild(slide);
    });

    viewport.appendChild(track);

    var controls = document.createElement('div');
    controls.className = 'heard-ts__controls';
    var prevBtn = makeButton('prev', 'Previous testimonial');
    var nextBtn = makeButton('next', 'Next testimonial');
    controls.appendChild(prevBtn);
    controls.appendChild(nextBtn);

    root.innerHTML = '';
    if (count === 1) root.setAttribute('data-single', '');
    root.appendChild(viewport);
    root.appendChild(controls);

    var index = 0;

    function render(animate) {
      if (animate === false) track.style.transition = 'none';
      track.style.transform = 'translateX(' + (-index * 100) + '%)';
      if (animate === false) {
        void track.offsetWidth;
        track.style.transition = '';
      }
      var nodes = track.children;
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].setAttribute('aria-hidden', i === index ? 'false' : 'true');
      }
    }

    function go(i, animate) {
      index = (i % count + count) % count;
      render(animate);
    }

    var MAX_PX = 24, MIN_PX = 16, REM = 16;
    function fitSlide(slide) {
      var body = slide.querySelector('.heard-ts__body');
      var media = slide.querySelector('.heard-ts__media');
      if (!body) return;
      if (!media || window.matchMedia('(max-width: 40rem)').matches) {
        slide.style.removeProperty('--ts-quote-size');
        return;
      }
      var target = media.offsetHeight;
      var px = MAX_PX;
      slide.style.setProperty('--ts-quote-size', (px / REM) + 'rem');
      while (px > MIN_PX && body.offsetHeight > target) {
        px -= 1;
        slide.style.setProperty('--ts-quote-size', (px / REM) + 'rem');
      }
    }
    function fitAll() {
      var nodes = track.children;
      for (var i = 0; i < nodes.length; i++) fitSlide(nodes[i]);
    }

    prevBtn.addEventListener('click', function () { go(index - 1); });
    nextBtn.addEventListener('click', function () { go(index + 1); });

    root.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { go(index - 1); }
      else if (e.key === 'ArrowRight') { go(index + 1); }
    });

    var startX = 0, delta = 0, dragging = false, width = 0;

    viewport.addEventListener('pointerdown', function (e) {
      dragging = true;
      startX = e.clientX;
      delta = 0;
      width = viewport.offsetWidth || 1;
      track.style.transition = 'none';
      if (viewport.setPointerCapture) {
        try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });

    viewport.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      delta = e.clientX - startX;
      track.style.transform =
        'translateX(' + (-index * 100 + (delta / width) * 100) + '%)';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      track.style.transition = '';
      if (Math.abs(delta) > width * 0.15) {
        go(index + (delta < 0 ? 1 : -1));
      } else {
        render();
      }
      delta = 0;
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    viewport.addEventListener('pointerleave', endDrag);

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { fitAll(); render(false); }, 120);
    });

    go(0, false);
    fitAll();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitAll);
    }
    window.addEventListener('load', fitAll);
  }

  function boot() {
    var nodes = document.querySelectorAll('[data-heard-ts]');
    for (var i = 0; i < nodes.length; i++) initSlider(nodes[i]);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
